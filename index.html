body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
header{background:linear-gradient(120deg,#7c3aed 0%,#db2777 45%,#f97316 80%,#facc15 110%);color:#fff;padding:18px 16px 58px;position:relative;overflow:hidden}
header .flores{position:absolute;right:-10px;bottom:-6px;width:min(300px,62vw);height:auto;opacity:.95;pointer-events:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
header .top,header .wrap{position:relative;z-index:1}
header h1{text-shadow:0 2px 10px rgba(0,0,0,.2)}
header .top{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
header h1{font-size:18px;margin:0;font-weight:750;letter-spacing:-.01em;flex:1}
header .sub{opacity:.75;font-size:12px}
.icobtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:12px;width:40px;height:40px;cursor:pointer;font-size:18px}
.icobtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}
main{max-width:760px;margin:-40px auto 0;padding:0 12px;position:relative}

.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .big{grid-column:1/-1}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}

.kpi .s{font-size:12px;color:var(--mut)}

"use strict";
/* ============================================================
   Mi Plata — app personal de ingresos y egresos
   Datos: nube privada (solo el dueño) cuando se abre como
   artifact de Claude; si no, en este dispositivo (localStorage).
   Sin innerHTML con datos: todo se pinta con textContent.
   ============================================================ */
const VERSION = "1.2";
const LS_TOK = "miplata.tok", LS_CACHE = "miplata.cache", LS_COLA = "miplata.cola";
const LS_KEY = "miplata.v1";
const LS_UI = "miplata.ui";

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "style") e.setAttribute("style", v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat(9)) if (k != null && k !== false) e.append(k.nodeType ? k : String(k));
  return e;
}
const pad = n => String(n).padStart(2, "0");
const isoDia = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const hoy = () => isoDia(new Date());
const mesDe = f => f.slice(0, 7);
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const nombreMes = m => MESES[+m.slice(5, 7) - 1] + " " + m.slice(0, 4);
const diasDelMes = m => new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
function sumMes(m, k) { let y = +m.slice(0, 4), mm = +m.slice(5, 7) + k; while (mm > 12) { mm -= 12; y++; } while (mm < 1) { mm += 12; y--; } return y + "-" + pad(mm); }
function fechaEnMes(f, k) { const m = sumMes(mesDe(f), k); const d = Math.min(+f.slice(8, 10), diasDelMes(m)); return m + "-" + pad(d); }
function diaTexto(f) {
  const t = hoy(); const d = new Date(f + "T12:00:00");
  const ay = new Date(); ay.setDate(ay.getDate() - 1);
  if (f === t) return "Hoy";
  if (f === isoDia(ay)) return "Ayer";
  return DIAS[d.getDay()] + " " + (+f.slice(8, 10)) + "/" + (+f.slice(5, 7));
}
const fmtN = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 2, minimumFractionDigits: 0 });
const money = n => (n < 0 ? "−$ " : "$ ") + fmtN.format(Math.abs(Math.round(n * 100) / 100));
function moneyK(n) {
  const a = Math.abs(n), s = n < 0 ? "−" : "";
  if (a >= 1e6) return s + "$ " + fmtN.format(Math.round(a / 1e4) / 100) + " M";
  if (a >= 1e4) return s + "$ " + fmtN.format(Math.round(a / 100) / 10) + " mil";
  return money(n);
}
/** Interpreta montos argentinos: "3.500", "3500,50", "1.234.567,8", "3500.5", "$ 12 mil", "1,5M" */
function parseMonto(s) {
  if (s == null) return NaN;
  let t = String(s).toLowerCase().replace(/\$|ars|\s/g, "");
  let mult = 1;
  const m1 = t.match(/^(.*?)(mil|k|m|millones|millon|millón)$/);
  if (m1) { t = m1[1]; mult = /^(mil|k)$/.test(m1[2]) ? 1e3 : 1e6; }
  if (!t) return NaN;
  if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
  const n = Number(t);
  return isFinite(n) ? Math.round(n * mult * 100) / 100 : NaN;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function toast(msg, ms = 2600) {
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = h("div", { class: "toast", role: "status", text: msg });
  document.body.append(t); setTimeout(() => t.remove(), ms);
}

const KW = [

/* ============================================================
   ALMACENAMIENTO
   Nube: colección "meses" (1 doc por mes: {items:[...]}) +
         doc "config/ajustes". Reglas: solo el dueño lee y escribe.
   Local: localStorage con la misma forma.
   ============================================================ */
const Store = {
  db: null, colas: {},
  /** Cambio ya aplicado en pantalla → guardarlo donde corresponda. */
  op(q, meses) {
    if (S.modo === "api") { guardarCache(); return Cola.poner(q); }
    if (q.accion === "cfg") return this.guardarCfg();
    return Promise.all((meses || []).map(m => this.guardarMes(m)));
  },
  async iniciar() {
    if (Api.url()) return iniciarApi();
    let db = null;
    try { if (window.claude && typeof window.claude.use === "function") db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) return this.modoLocal();
    this.db = db;
    let llego = false;
    const timer = setTimeout(() => { if (!llego) estado("Sin conexión a la nube todavía: lo que veas puede no estar al día", false); }, 10000);
    try {
      db.collection("meses").onSnapshot(snap => {
        llego = true; if (!snap.metadata.fromCache) clearTimeout(timer);
        const nuevos = {};
        snap.docs.forEach(d => { const x = d.data(); if (x && Array.isArray(x.items)) nuevos[d.id] = x.items; });
        S.meses = nuevos; S.modo = "nube";
        estado(snap.metadata.fromCache ? "Nube · sincronizando…" : "Guardado en tu nube privada", !snap.metadata.fromCache);
        render();
      }, err => { clearTimeout(timer); this.falla(err); });
      db.doc("config/ajustes").onSnapshot(snap => {
        if (snap.exists) { const c = snap.data(); S.cfg = Object.assign(JSON.parse(JSON.stringify(CFG_DEF)), c && c.cfg ? c.cfg : {}); render(); }
      }, err => this.falla(err));
    } catch (e) { clearTimeout(timer); this.falla(e); }
  },
  falla(err) {
    if (S.modo === "local") return;
    console.warn("db", err && err.code);
    this.db = null; this.modoLocal("La nube no respondió: guardando en este dispositivo");
  },
  modoLocal(msg) {
    S.modo = "local";
    try { const raw = localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); S.meses = d.meses || {}; if (d.cfg) S.cfg = Object.assign(JSON.parse(JSON.stringify(CFG_DEF)), d.cfg); } }
    catch (e) { msg = "Este navegador no deja guardar: exportá un respaldo seguido"; }
    estado(msg || "Guardado en este dispositivo", true);
    render();
  },
  persistLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify({ v: VERSION, meses: S.meses, cfg: S.cfg })); return true; } catch (e) { toast("No se pudo guardar en este navegador. Exportá un respaldo."); return false; } },
  /** Escribe un mes completo (una escritura a la vez por documento). */
  guardarMes(m) {
    if (S.modo !== "nube" || !this.db) { this.persistLocal(); return Promise.resolve(); }
    const items = itemsMes(m).slice();
    const ref = this.db.doc("meses/" + m);
    const prev = this.colas[m] || Promise.resolve();
    const p = prev.catch(() => {}).then(() => items.length ? ref.set({ items, actualizado: new Date().toISOString() }) : ref.delete())
      .catch(e => { toast(e && e.code === "quota_exceeded" ? "La nube está llena: exportá y borrá meses viejos." : "No se pudo guardar en la nube. Reintentá."); throw e; });
    this.colas[m] = p; return p;
  },
  guardarCfg() {
    if (S.modo === "api") { guardarCache(); return Cola.poner({ accion: "cfg", cfg: JSON.parse(JSON.stringify(S.cfg)) }); }
    if (S.modo !== "nube" || !this.db) { this.persistLocal(); return Promise.resolve(); }
    const ref = this.db.doc("config/ajustes"), cfg = JSON.parse(JSON.stringify(S.cfg));
    const prev = this.colas._cfg || Promise.resolve();
    return this.colas._cfg = prev.catch(() => {}).then(() => ref.set({ cfg, actualizado: new Date().toISOString() })).catch(() => toast("No se pudo guardar la configuración."));
  }
};

const Api = {
  url: () => String(window.MP_API || "").trim(),
  tok() { try { return localStorage.getItem(LS_TOK) || ""; } catch (e) { return ""; } },
  setTok(t) { try { t ? localStorage.setItem(LS_TOK, t) : localStorage.removeItem(LS_TOK); } catch (e) {} },
  async llamar(q, conToken = true) {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 35000);

      const r = await fetch(this.url(), { method: "POST", body, headers: { "Content-Type": "text/plain;charset=utf-8" }, redirect: "follow", cache: "no-store", credentials: "omit", signal: ctl.signal });

};
function dispositivo() {

  const nav = /Edg\//.test(u) ? "Edge" : /Chrome\//.test(u) ? "Chrome" : /Safari\//.test(u) ? "Safari" : /Firefox\//.test(u) ? "Firefox" : "Navegador";

function deItems(items) {

const Cola = {

/* ---------- operaciones sobre movimientos ---------- */
function agregarItems(lista) {

  lista.forEach(it => { const m = mesDe(it.f); (S.meses[m] = S.meses[m] || []).push(it); tocados.add(m); });

function borrarItem(id) {

/** Arma los items de un alta (con cuotas si corresponde). */
function armarAlta({ t, m, c, p, f, n, d, cuotas, fx }) {
  const base = { t, c, p, n: n || "", ts: Date.now() };
  if (d) base.d = d; if (fx) base.fx = fx;
  if (t === "e" && cuotas > 1) {
    const g = uid(), cu = Math.round(m / cuotas * 100) / 100;
    return Array.from({ length: cuotas }, (_, k) => Object.assign({}, base, {
      id: uid() + k, f: fechaEnMes(f, k), m: k === cuotas - 1 ? Math.round((m - cu * (cuotas - 1)) * 100) / 100 : cu,
      g, q: (k + 1) + "/" + cuotas, ts: base.ts + k, d: k === 0 ? base.d : undefined
    }));

/* ---------- carga rápida en texto ---------- */
function interpretar(txt) {
  const s = norm(txt);
  const cands = [...s.matchAll(/[+-]?\$?\s*\d[\d.,]*\s*(mil\b|k\b|m\b|millones\b)?/g)].filter(x => !/^\s*cuotas?/.test(s.slice(x.index + x[0].length)));
  const mm = cands[0];
  if (!mm) return null;
  const monto = parseMonto(mm[0].replace(/^[+-]/, ""));
  if (!(monto > 0)) return null;
  let cat = null; for (const [re, c] of KW) if (re.test(s)) { cat = c; break; }
  let medio = null; for (const [re, c] of KWM) if (re.test(s)) { medio = c; break; }
  const cuo = s.match(/(\d{1,2})\s*cuotas?/);
  const esIng = /^\s*\+/.test(s) || /cobre|me pagaron|ingreso|entro/.test(s) || (cat && S.cfg.catI.some(x => x[0] === cat));
  const t = esIng ? "i" : "e";
  if (cat && !catsDe(t).some(x => x[0] === cat)) cat = null;
  if (!cat) cat = t === "i" ? (S.cfg.catI[0] || ["Otros ingresos"])[0] : "Otros";
  if (medio && !S.cfg.medios.includes(medio)) medio = null;
  let nota = txt.replace(mm[0].trim(), "").replace(/\s+/g, " ").trim();
  if (cuo) nota = nota.replace(new RegExp(cuo[0], "i"), "").trim();
  nota = nota.replace(/(^|\s)(mp|mercado ?pago|d[eé]bito|deb|cr[eé]dito|cred|efectivo|ef|transf(erencia)?|en|con|\$)(?=\s|$)/gi, " ").replace(/^\+/, "").replace(/\s+/g, " ").trim();
  return { t, m: monto, c: cat, p: medio || S.form.p || S.cfg.medios[0], n: nota, cuotas: cuo ? Math.min(48, +cuo[1]) : 1 };
}

/* ============================================================
   CÁLCULOS
   ============================================================ */
function resumen(m) {
  const L = itemsMes(m);
  const R = { ing: 0, egr: 0, desc: 0, porCat: {}, porMedio: {}, porDia: {}, fijosE: 0, credito: 0, n: L.length };
  L.forEach(x => {
    if (x.t === "i") R.ing += x.m;
    else {
      R.egr += x.m; R.porCat[x.c] = (R.porCat[x.c] || 0) + x.m; R.porMedio[x.p] = (R.porMedio[x.p] || 0) + x.m;
      R.porDia[x.f] = (R.porDia[x.f] || 0) + x.m; if (x.fx) R.fijosE += x.m; if (x.p === "Crédito") R.credito += x.m;
    }
    if (x.d) R.desc += x.d;
  });
  R.saldo = R.ing - R.egr;
  R.tasa = R.ing > 0 ? R.saldo / R.ing * 100 : null;
  return R;
}
function fijosPendientes(m) {
  const L = itemsMes(m);
  return S.cfg.fijos.filter(fj => !L.some(x => x.fx === fj.id));
}
function proyeccion(m) {
  const t = hoy(); if (m !== mesDe(t)) return null;
  const R = resumen(m), dia = +t.slice(8, 10), total = diasDelMes(m);
  const variable = R.egr - R.fijosE - cuotasViejas(m);
  // Los primeros días el ritmo es engañoso: se mezcla con el del mes anterior.
  const mp = sumMes(m, -1), Rp = resumen(mp), varPrev = Rp.egr - Rp.fijosE - cuotasViejas(mp);
  let promDia = variable / dia, base = "este mes";
  if (dia < 10 && varPrev > 0) { const w = dia / 10; promDia = w * promDia + (1 - w) * varPrev / diasDelMes(mp); base = "mezcla con " + MESES[+mp.slice(5) - 1]; }
  else if (dia < 5) return { temprano: true, restan: total - dia };
  const pend = fijosPendientes(m);
  const pendE = pend.filter(f => f.t !== "i").reduce((a, f) => a + f.m, 0);
  const pendI = pend.filter(f => f.t === "i").reduce((a, f) => a + f.m, 0);
  const egrFin = R.egr + promDia * (total - dia) + pendE;
  const ingFin = R.ing + pendI;
  return { promDia, egrFin, ingFin, saldoFin: ingFin - egrFin, restan: total - dia, pendE, pendI, base };
}
/** Cuotas 2/N en adelante: ya estaban comprometidas, no son gasto del día a día. */
function cuotasViejas(m) { return itemsMes(m).filter(x => x.t === "e" && x.q && !x.q.startsWith("1/")).reduce((a, x) => a + x.m, 0); }
function consejos(m) {
  const out = [], R = resumen(m), Rp = resumen(sumMes(m, -1)), P0 = proyeccion(m), P = P0 && !P0.temprano ? P0 : null;
  if (!R.n) return out;
  Object.entries(S.cfg.presu).forEach(([c, tope]) => {
    if (!(tope > 0)) return; const g = R.porCat[c] || 0;
    if (g > tope) out.push(["b", "🚨", `${c}: te pasaste ${money(g - tope)} del tope (${money(tope)}).`, 3]);

/* ============================================================
   RENDIMIENTO DE MERCADO PAGO + PROYECTADO
   Fuente: valor de cuotaparte de «Mercado Fondo - Clase A» (el FCI
   donde Mercado Pago invierte los saldos remunerados), publicado por
   la CNV y servido por la API pública ArgentinaDatos. TNA = variación
   de los últimos ~30 días anualizada. Inflación: INDEC (misma API).
   ============================================================ */
const MP_FONDO = "Mercado Fondo - Clase A";
const AD = "https://api.argentinadatos.com/v1/finanzas/";
const Rend = {
  dato: null, cargando: null, error: false,
  async obtener(forzar) {
    if (this.dato && !forzar) return this.dato;
    if (!forzar) { try { const c = JSON.parse(localStorage.getItem("miplata.tna") || "null"); if (c && Date.now() - c.leido < 6 * 3600e3) return (this.dato = c); } catch (e) {} }
    if (this.cargando) return this.cargando;
    const get = async u => {
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
      try { const r = await fetch(AD + u, { cache: "no-store", credentials: "omit", signal: ctl.signal }); if (!r.ok) return null; return await r.json(); }
      catch (e) { return null; } finally { clearTimeout(to); }
    };
    const fondo = j => Array.isArray(j) ? j.find(x => x && x.fondo === MP_FONDO && +x.vcp > 0) : null;
    const dia = f => new Date(f + "T12:00:00");
    this.cargando = (async () => {
      const ult = fondo(await get("fci/mercadoDinero/ultimo"));
      if (!ult) throw new Error("sin dato");
      let base = null;
      // La API no publica todos los fondos todos los días: busco el dato más cercano a 30 días atrás.
      for (const k of [30, 31, 29, 32, 28, 33, 34, 27, 35, 36, 26, 37, 38, 25, 39, 40]) { if (base) break; const d = dia(ult.fecha); d.setDate(d.getDate() - k); base = fondo(await get("fci/mercadoDinero/" + d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate())));
      }
      const pen = fondo(await get("fci/mercadoDinero/penultimo"));
      const dd = (a, b) => Math.max(1, Math.round((dia(a.fecha) - dia(b.fecha)) / 864e5));
      const tna30 = base ? (ult.vcp / base.vcp - 1) * 365 / dd(ult, base) * 100 : null;
      const tna1 = pen && pen.fecha < ult.fecha ? (ult.vcp / pen.vcp - 1) * 365 / dd(ult, pen) * 100 : null;
      const inf = await get("indices/inflacion");
      const ui = Array.isArray(inf) && inf.length ? inf[inf.length - 1] : null;
      const out = { tna: tna30 != null ? tna30 : tna1, tna30, tna1, fecha: ult.fecha, desde: base ? base.fecha : null, inflacion: ui ? +ui.valor : null, infFecha: ui ? ui.fecha : null, leido: Date.now() };
      if (!(out.tna > 0 && out.tna < 300)) throw new Error("dato raro");
      try { localStorage.setItem("miplata.tna", JSON.stringify(out)); } catch (e) {}
      this.error = false;
      return (this.dato = out);
    })().catch(e => { this.error = true; try { const c = JSON.parse(localStorage.getItem("miplata.tna") || "null"); if (c) return (this.dato = c); } catch (x) {} return null; })
      .finally(() => { this.cargando = null; });
    return this.cargando;
  }
};
const tnaUsada = () => (+S.cfg.tnaManual > 0 ? +S.cfg.tnaManual : Rend.dato ? Rend.dato.tna : 0);
const fmtPct = n => fmtN.format(Math.round(n * 10) / 10) + " %";
const fechaCorta = f => f ? (+f.slice(8, 10)) + "/" + (+f.slice(5, 7)) : "";
/** Rinde de un saldo en N días con capitalización diaria (como acredita Mercado Pago). */
const rinde = (saldo, tna, dias) => saldo > 0 ? saldo * (Math.pow(1 + tna / 100 / 365, dias) - 1) : 0;
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
function cuotasMes(m) { return itemsMes(m).filter(x => x.t === "e" && x.q).reduce((a, x) => a + x.m, 0); }

function proyectado({ horiz, recorte, pctMP, tna, saldo0 }) {
  const hm = mesDe(hoy());
  const cerrados = [1, 2, 3].map(k => sumMes(hm, -k)).filter(m => itemsMes(m).length);
  const varDe = m => { const R = resumen(m); return Math.max(0, R.egr - R.fijosE - cuotasViejas(m)); };
  // Ingresos variables: sin los que ya están como fijo (ej. el sueldo cargado a mano y también como fijo) ni rendimientos.
  const catFijasI = new Set(S.cfg.fijos.filter(f => f.t === "i").map(f => f.c));
  const ingVarDe = m => itemsMes(m).filter(x => x.t === "i" && !x.fx && x.c !== "Intereses" && !catFijasI.has(x.c)).reduce((a, x) => a + x.m, 0);
  let baseVar, baseIng, fuente;
  if (cerrados.length) { baseVar = avg(cerrados.map(varDe)); baseIng = avg(cerrados.map(ingVarDe)); fuente = cerrados.length === 1 ? "lo que pasó en " + MESES[+cerrados[0].slice(5) - 1] : `el promedio de tus últimos ${cerrados.length} meses`; }
  else {
    const dia = +hoy().slice(8, 10), tot = diasDelMes(hm);
    baseVar = varDe(hm) / Math.max(dia, 5) * tot; baseIng = ingVarDe(hm); fuente = "el ritmo de este mes (se afina cuando cierre el mes)";
  }
  const fijosI = S.cfg.fijos.filter(f => f.t === "i").reduce((a, f) => a + f.m, 0);
  const fijosE = S.cfg.fijos.filter(f => f.t !== "i").reduce((a, f) => a + f.m, 0);
  const filas = []; let saldo = saldo0, totRinde = 0, totAhorro = 0;
  // resto del mes en curso
  const P = proyeccion(hm), R = resumen(hm), diasRest = diasDelMes(hm) - (+hoy().slice(8, 10));
  if (P && !P.temprano && diasRest > 0) {
    const ing = Math.max(0, P.ingFin - R.ing), egr = Math.max(0, (P.egrFin - R.egr) * (1 - recorte / 100));
    const ah = ing - egr, r = rinde(saldo, tna, diasRest);
    saldo += r + (ah >= 0 ? ah * pctMP / 100 : ah); saldo = Math.max(0, saldo); totRinde += r; totAhorro += ah;
    filas.push({ m: hm, resto: true, ing, egr, ah, r, saldo });
  }
  for (let k = 1; k <= horiz; k++) {
    const m = sumMes(hm, k), cu = cuotasMes(m);
    const ing = fijosI + baseIng, egr = fijosE + cu + baseVar * (1 - recorte / 100);
    const ah = ing - egr, r = rinde(saldo, tna, diasDelMes(m));
    saldo += r + (ah >= 0 ? ah * pctMP / 100 : ah); saldo = Math.max(0, saldo); totRinde += r; totAhorro += ah;
    filas.push({ m, ing, egr, ah, r, cu, saldo });
  }
  return { filas, saldoFin: saldo, totRinde, totAhorro, baseVar, baseIng, fijosI, fijosE, fuente, sinIngresos: !(fijosI + baseIng > 0) };
}

  app.append(h("section", { class: "card" }, h("h2", { text: "🏷️ Categorías y medios de pago" }),
    h("p", { class: "hint", text: "Una por línea. Podés poner un emoji adelante. Los movimientos viejos conservan su categoría." }),
    h("div", { class: "lbl", text: "Gastos" }), txE, h("div", { class: "lbl", text: "Ingresos" }), txI, h("div", { class: "lbl", text: "Medios (dejá «Crédito» para usar cuotas)" }), txM,

    h("div", { class: "row" },

    } })),

async function salir(todas) {
  if (Cola.lista.length) { toast("Esperá: hay cambios sin subir. Probá de nuevo con conexión."); return; }
  try { await Api.llamar({ accion: "logout", todas }); } catch (e) {}
  Api.setTok(""); try { localStorage.removeItem(LS_CACHE); } catch (e) {}
  S.meses = {}; S.cfg = JSON.parse(JSON.stringify(CFG_DEF)); mostrarLogin(todas ? "Cerraste la sesión en todos los equipos." : "Sesión cerrada.");
}
function validoItem(x) {
  return x && typeof x.id === "string" && x.id.length < 40 && /^\d{4}-\d{2}-\d{2}$/.test(x.f) && (x.t === "e" || x.t === "i") && typeof x.m === "number" && isFinite(x.m) && x.m > 0 && x.m < 1e12 && typeof x.c === "string" && typeof x.p === "string";
}
function sanearCfg(c) {
  const o = {};
  if (Array.isArray(c.catE)) o.catE = c.catE.filter(a => Array.isArray(a) && typeof a[0] === "string").slice(0, 40).map(a => [a[0].slice(0, 40), String(a[1] || "•").slice(0, 8)]);
  if (Array.isArray(c.catI)) o.catI = c.catI.filter(a => Array.isArray(a) && typeof a[0] === "string").slice(0, 40).map(a => [a[0].slice(0, 40), String(a[1] || "•").slice(0, 8)]);
  if (Array.isArray(c.medios)) o.medios = c.medios.filter(s => typeof s === "string").slice(0, 15).map(s => s.slice(0, 30));
  if (c.presu && typeof c.presu === "object") { o.presu = {}; for (const k in c.presu) if (+c.presu[k] > 0) o.presu[String(k).slice(0, 40)] = +c.presu[k]; }
  if (Array.isArray(c.fijos)) o.fijos = c.fijos.filter(f => f && typeof f.n === "string" && +f.m > 0).slice(0, 60).map(f => ({ id: String(f.id || uid()).slice(0, 40), t: f.t === "i" ? "i" : "e", n: f.n.slice(0, 60), m: +f.m, c: String(f.c || "Otros").slice(0, 40), p: String(f.p || "Efectivo").slice(0, 30), dia: Math.max(1, Math.min(31, +f.dia || 1)) }));
  if (+c.objAhorro >= 0) o.objAhorro = Math.min(90, +c.objAhorro);
  if (+c.saldoMP >= 0) o.saldoMP = Math.min(1e12, +c.saldoMP);
  if (+c.tnaManual >= 0) o.tnaManual = Math.min(300, +c.tnaManual);
  if ([3, 6, 12, 24].includes(+c.horiz)) o.horiz = +c.horiz;
  if (+c.recorte >= 0) o.recorte = Math.min(50, +c.recorte);
  if (+c.pctMP >= 0) o.pctMP = Math.min(100, +c.pctMP);
  return o;
}

/* ---------- exportación ---------- */
async function descargar(nombre, texto, tipo) {
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename: nombre, data: texto }); toast("Listo: " + nombre); return; }
  } catch (e) { if (e && /declin|cancel|reject/i.test(String(e.code || e.message))) { toast("Descarga cancelada"); return; } }
  try {
    const url = URL.createObjectURL(new Blob([texto], { type: tipo }));
    const a = h("a", { href: url, download: nombre }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Descargando " + nombre);
  } catch (e) {
    try { await navigator.clipboard.writeText(texto); toast("No se pudo descargar: lo copié al portapapeles"); } catch (e2) { toast("No se pudo descargar en este navegador."); }
  }
}
const sello = () => { const d = new Date(); return isoDia(d) + "_" + pad(d.getHours()) + pad(d.getMinutes()); };
function exportarJSON() { descargar(`MiPlata_respaldo_${sello()}.json`, JSON.stringify({ app: "MiPlata", v: VERSION, exportado: new Date().toISOString(), meses: S.meses, cfg: S.cfg }, null, 1), "application/json"); }
function exportarCSV(m) {
  const L = (m ? itemsMes(m) : todos().sort((a, b) => a.f.localeCompare(b.f)));
  const esc = v => { let s = String(v == null ? "" : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const num = n => String(Math.round(n * 100) / 100).replace(".", ",");
  const filas = [["Fecha", "Tipo", "Categoría", "Medio", "Detalle", "Ingreso", "Egreso", "Neto", "Descuento", "Cuota", "Fijo"]];
  L.forEach(x => filas.push([x.f.split("-").reverse().join("/"), x.t === "i" ? "Ingreso" : "Egreso", x.c, x.p, x.n || "", x.t === "i" ? num(x.m) : "", x.t === "e" ? num(x.m) : "", num(x.t === "i" ? x.m : -x.m), x.d ? num(x.d) : "", x.q || "", x.fx ? "Sí" : ""]));
  const csv = "﻿" + "sep=;\n" + filas.map(r => r.map((v, i) => i >= 5 && i <= 8 ? v : esc(v)).join(";")).join("\r\n");
  descargar(`MiPlata_${m || "historial"}_${sello()}.csv`, csv, "text/csv;charset=utf-8");
}

setInterval(() => { const m = mesDe(hoy()); if (S._dia !== hoy()) { S._dia = hoy(); if (S.mesSel < m && S.tab === "hoy") S.mesSel = m; render(); } }, 60000);
S._dia = hoy();
